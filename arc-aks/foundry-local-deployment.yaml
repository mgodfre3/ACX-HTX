apiVersion: v1
kind: Namespace
metadata:
  name: htx-foundry-local
  labels:
    workload: sovereign-inference
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-mirror-pull
  namespace: htx-foundry-local
type: kubernetes.io/dockerconfigjson
# Populated by the Arc-AKS operator via ExternalSecret / SealedSecret from the on-prem KV.
# The connected registry mirror is on-cluster, so pull auth is against the mirror's local token.
data:
  .dockerconfigjson: PLACEHOLDER_BASE64
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights
  namespace: htx-foundry-local
spec:
  accessModes: [ ReadOnlyMany ]
  resources:
    requests:
      storage: 10Gi
  # StorageClass on ALDO Arc-AKS uses a CSI driver backed by the on-prem CMK.
  storageClassName: aldo-cmk-premium
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pull-antenna-model
  namespace: htx-foundry-local
spec:
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: registry-mirror-pull
      containers:
        - name: pull
          image: aldo-tokyo-wkld.local:5000/oras-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              oras pull aldo-tokyo-wkld.local:5000/models/htx-antenna-detector:v1 \
                -o /models/antenna
              ls -la /models/antenna
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-weights
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry-local-antenna
  namespace: htx-foundry-local
  labels:
    app: foundry-local
    workload: antenna-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundry-local
      workload: antenna-detector
  template:
    metadata:
      labels:
        app: foundry-local
        workload: antenna-detector
    spec:
      # Schedule onto A100 nodes on the ALDO stamp
      nodeSelector:
        htx.aldo/gpu: a100
        htx.aldo/stamp: tokyo-wkld
      containers:
        - name: foundry-local
          image: aldo-tokyo-wkld.local:5000/foundry-local:phi4-mini-onnx
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 16Gi
          env:
            - name: FOUNDRY_MODEL_PATH
              value: /models/antenna
            - name: FOUNDRY_INFERENCE_BACKEND
              value: onnxruntime-gpu
          ports:
            - name: inference
              containerPort: 8080
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: inference
            initialDelaySeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-weights
---
apiVersion: v1
kind: Service
metadata:
  name: foundry-local-antenna
  namespace: htx-foundry-local
spec:
  # ClusterIP only — inference never leaves the ALDO cluster
  type: ClusterIP
  selector:
    app: foundry-local
    workload: antenna-detector
  ports:
    - name: inference
      port: 8080
      targetPort: inference
